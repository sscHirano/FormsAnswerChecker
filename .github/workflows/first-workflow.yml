name: First GitHub Actions Workflow

# ワークフローが起動するトリガー（きっかけ）を定義します
on:
  # リポジトリに push されたときに実行
  push:
    branches: [ "main", "master", "test_github_actions" ]
  # Pull Request が作成・更新されたときに実行
  pull_request:
    branches: [ "main", "master", "test_github_actions" ]
  # GitHubの「Actions」タブから手動でボタンを押して実行できるようにする設定
  workflow_dispatch:

# 実行するジョブ（処理のまとまり）を定義します
jobs:
  greet:
    name: Say Hello Job
    # ワークフローを実行する仮想マシンのOSを指定（ubuntu-latest, windows-latest, macos-latest など）
    runs-on: ubuntu-latest

    # ジョブ内で順番に実行する手順（ステップ）
    steps:
      # ステップ1: リポジトリのコードを仮想マシン上にチェックアウト（取得）する公式アクション
      - name: Checkout repository
        uses: actions/checkout@v4

      # ステップ2: コマンドを実行して挨拶を出力
      - name: Run a simple echo command
        run: |
          echo "Hello, GitHub Actions!"
          echo "トリガーされたイベント: ${{ github.event_name }}"
          echo "実行ブランチ: ${{ github.ref_name }}"
          echo "コミットSHA: ${{ github.sha }}"

      # ステップ3: 複数行のシェルスクリプトを実行
      - name: Show system information
        run: |
          echo "=== 実行環境のOS情報 ==="
          uname -a
          echo "=== 現在の日時 ==="
          date
